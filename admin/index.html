<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <!-- Заглушка на время закрытой подготовки к запуску: см. /guard.js -->
  <script src="/guard.js"></script>
  <noscript><meta http-equiv="refresh" content="0; url=/guard/"><style>body{display:none}</style></noscript>
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Управление — Podlesny Twins</title>
  <link rel="stylesheet" href="/ricochet/styles.css">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <header class="site-header"><div class="container header-inner">
    <a class="logo" href="/">Podlesny&nbsp;Twins</a>
    <button id="logout" class="btn btn-secondary btn-small" hidden>Выйти</button>
  </div></header>
  <main class="admin container">
    <section id="auth" class="account-pane">
      <h1>Управление продажами.</h1>
      <form id="login"><label class="field"><span class="field-label">Рабочая почта</span>
        <input name="email" type="email" autocomplete="username" required></label>
        <label class="field"><span class="field-label">Пароль</span>
        <input name="password" type="password" autocomplete="current-password" required></label>
        <p class="checkout-error" role="alert" hidden></p>
        <button class="btn btn-primary" type="submit">Продолжить</button>
        <button class="linklike" id="setup-open" type="button">Первый вход или смена пароля</button>
      </form>
      <form id="code" hidden><p>Код отправлен на <b class="target-email"></b>.</p>
        <label class="field"><span class="field-label">Код из письма</span>
        <input name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required></label>
        <p class="checkout-error" role="alert" hidden></p>
        <button class="btn btn-primary" type="submit">Войти</button></form>
      <form id="setup" hidden><p>Получите одноразовый код, затем задайте новый пароль.</p>
        <label class="field"><span class="field-label">Рабочая почта</span><input name="email" type="email" required></label>
        <button id="send-setup" class="btn btn-secondary" type="button">Получить код</button>
        <label class="field"><span class="field-label">Код</span><input name="code" inputmode="numeric" maxlength="6" required></label>
        <label class="field"><span class="field-label">Новый пароль</span><input name="password" type="password" minlength="12" autocomplete="new-password" required><span class="field-hint">Не короче 12 символов.</span></label>
        <p class="checkout-error" role="alert" hidden></p>
        <button class="btn btn-primary" type="submit">Сохранить пароль</button>
        <button class="linklike" id="login-open" type="button">Вернуться ко входу</button>
      </form>
    </section>

    <section id="crm" hidden>
      <div class="admin-title"><div><h1>Заказы и устройства.</h1><p id="admin-email"></p></div>
        <a id="csv" class="btn btn-secondary" href="#">Скачать CSV</a></div>
      <div id="metrics" class="metrics"></div>
      <form id="search" class="search"><input name="q" type="search" placeholder="Заказ, имя, почта, продукт или статус"><button class="btn btn-secondary">Найти</button></form>
      <p id="crm-message" class="muted-note" role="status" aria-live="polite"></p>
      <div class="table-wrap"><table><thead><tr><th>Дата</th><th>Покупатель</th><th>Продукт</th><th>Статус</th><th>Сумма</th><th>Устройства</th><th></th></tr></thead><tbody id="orders"></tbody></table></div>
    </section>
  </main>
  <script src="admin.js"></script>
</body></html>
