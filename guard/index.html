<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Podlesny Plugins</title>
  <meta name="robots" content="noindex, nofollow, noarchive">
  <link rel="icon" href="/ricochet/assets/favicon.svg" type="image/svg+xml">
  <style>
    /* Только Golos для кириллицы плейсхолдера и ошибки. Сам лок-ап — контуры
       Work Sans, вшитые в разметку: шрифт ради двух слов не грузим, и заставка
       рисуется без единого сетевого запроса за шрифтом. */
    @font-face {
      font-family: 'Golos Text';
      src: url('/ricochet/assets/fonts/GolosText-cyrillic.woff2') format('woff2');
      font-weight: 400 900; font-display: swap;
      unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
    }
    @font-face {
      font-family: 'Golos Text';
      src: url('/ricochet/assets/fonts/GolosText-latin.woff2') format('woff2');
      font-weight: 400 900; font-display: swap;
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+20AC, U+2122, U+FEFF, U+FFFD;
    }

    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: 'Golos Text', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      font-weight: 450;
      -webkit-font-smoothing: auto;
    }

    .gate {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 32px 24px;
    }
    .gate-inner { width: 100%; max-width: 320px; }

    .gate-logo {
      display: block;
      width: 100%;
      height: auto;
      color: #fff;
    }

    /* Строчка ввода: одна линия, без рамки и фона. Приглушённая, пока поле
       не в фокусе, — чтобы на чёрном не спорила с лок-апом. */
    .gate-line {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 44px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.35);
      transition: border-color 0.2s ease;
    }
    .gate-line:focus-within { border-bottom-color: #fff; }

    .gate-line input {
      flex: 1;
      min-width: 0;
      border: 0;
      background: transparent;
      color: #fff;
      font: inherit;
      /* 16px — ниже этого iOS зумит страницу на фокусе поля. */
      font-size: 1rem;
      line-height: 1.4;
      padding: 10px 0;
    }
    .gate-line input:focus { outline: none; }
    .gate-line input::placeholder { color: rgba(255, 255, 255, 0.4); }

    .gate-line button {
      flex: none;
      border: 0;
      background: transparent;
      color: rgba(255, 255, 255, 0.4);
      font: inherit;
      font-size: 1.125rem;
      line-height: 1;
      padding: 8px 2px;
      cursor: pointer;
      transition: color 0.2s ease;
    }
    .gate-line button:hover:not(:disabled),
    .gate-line:focus-within button { color: #fff; }
    .gate-line button:disabled { cursor: progress; }

    .gate-error {
      margin: 12px 0 0;
      font-size: 0.8125rem;
      line-height: 1.5;
      color: #ff8080;
    }

    /* Метка для скринридера: поле без видимого лейбла остаётся подписанным. */
    .sr-only {
      position: absolute; width: 1px; height: 1px;
      margin: -1px; padding: 0; border: 0;
      clip-path: inset(50%); overflow: hidden; white-space: nowrap;
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>

      <form id="gate-form" novalidate>
        <label class="sr-only" for="gate-pass">Пароль</label>
        <div class="gate-line">
          <input type="password" id="gate-pass" name="password" placeholder="Пароль"
                 autocomplete="current-password" autocapitalize="off"
                 spellcheck="false" required autofocus>
          <button type="submit" id="gate-submit" aria-label="Войти">&rarr;</button>
        </div>
        <p class="gate-error" id="gate-error" role="alert" hidden></p>
      </form>
    </div>
  </main>

  <script>
  (function () {
    var KEY = 'pt_site_guard';
    var SALT = 'pt-guard-2026';
    var TOKEN = 'b14b95142810212a037dc7767f0a539ee6a562d5daec5e80de6390825dc9a4c1';

    var form = document.getElementById('gate-form');
    var input = document.getElementById('gate-pass');
    var error = document.getElementById('gate-error');
    var submit = document.getElementById('gate-submit');

    /* Куда вернуть после ввода. Открытый редирект здесь не нужен: берём
       только собственные пути сайта. «//evil.com» — валидный путь для
       location, но уводит на чужой домен, поэтому отсекаем отдельно. */
    function safeNext() {
      var raw = new URLSearchParams(location.search).get('next');
      if (!raw || raw.charAt(0) !== '/' || raw.slice(0, 2) === '//') return '/';
      if (raw.indexOf('/guard') === 0) return '/';
      return raw;
    }

    function say(message) {
      error.textContent = message;
      error.hidden = !message;
      input.setAttribute('aria-invalid', message ? 'true' : 'false');
    }

    function digest(value) {
      var bytes = new TextEncoder().encode(SALT + ':' + value);
      return crypto.subtle.digest('SHA-256', bytes).then(function (buffer) {
        return Array.prototype.map.call(new Uint8Array(buffer), function (b) {
          return ('0' + b.toString(16)).slice(-2);
        }).join('');
      });
    }

    var unlocked = false;
    try { unlocked = localStorage.getItem(KEY) === TOKEN; } catch (e) {}
    if (unlocked) { location.replace(safeNext()); return; }

    form.addEventListener('submit', function (event) {
      event.preventDefault();
      var value = input.value;
      if (!value) { input.focus(); return; }

      // crypto.subtle живёт только в защищённом контексте: по http или
      // из файла его нет, и без этой ветки форма молча ничего не делала бы.
      if (!window.crypto || !crypto.subtle) {
        say('Проверка пароля недоступна: откройте сайт по https.');
        return;
      }

      submit.disabled = true;
      say('');
      digest(value).then(function (hash) {
        if (hash !== TOKEN) {
          submit.disabled = false;
          say('Пароль не подходит.');
          input.select();
          return;
        }
        try { localStorage.setItem(KEY, TOKEN); } catch (e) {}
        location.replace(safeNext());
      }).catch(function () {
        submit.disabled = false;
        say('Не получилось проверить пароль. Попробуйте ещё раз.');
      });
    });
  })();
  </script>
